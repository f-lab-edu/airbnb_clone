name: Deploy airbnb_clone to S3 + CloudFront (OIDC)

on:
  push:
    branches:
      - dev # dev 브랜치에 push 될 때 자동 배포

permissions:
  id-token: write # 🔐 OIDC 토큰 발급에 필수
  contents: read # 코드 체크아웃에 필요

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      BUILD_DIR: ${{ secrets.BUILD_DIR || 'dist' }}
    steps:
      # 1) 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Node 설정 (버전은 프로젝트에 맞게 조정)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3) 의존성 설치
      - name: Install dependencies
        run: npm ci
        # yarn 쓰면:   run: yarn install --frozen-lockfile
        # pnpm 쓰면:  run: pnpm install --frozen-lockfile

      # 4) 앱 빌드
      - name: Build app
        run: npm run build
        # yarn: run: yarn build
        # pnpm: run: pnpm build

      # 5) AWS 자격 증명 설정 (OIDC + IAM Role Assume)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::433648435440:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # 6) S3와 동기화
      - name: Sync build output to S3
        run: |
          aws s3 sync "$BUILD_DIR"/ "s3://$S3_BUCKET/" --delete

      # 7) CloudFront 캐시 무효화
      - name: Create CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
